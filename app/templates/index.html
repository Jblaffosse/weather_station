{% extends "base.html" %}

{% block page_content %}

    <!--div class="container"-->
        <h1>Welcome to the web page for the Weather Station!</h1>
        <h2>Please select a weather station...</h2>
        
        <form id="station-form">
            <select id="station-select" class="form-select">
                <option value="">-- Select a Station --</option>
                {% for station in weather_stations %}
                    <option value="{{ station.station_name }}">{{ station.station_name }}</option>
                {% endfor %}
            </select>
        </form>

        <canvas id="weather-chart" width="800" height="400" style="margin-top: 20px;"></canvas>
    <!--/div-->
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const chartContext = document.getElementById('weather-chart').getContext('2d');
        let weatherChart = new Chart(chartContext, {
            type: 'line',
            data: {
                labels: [], // Timestamps
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        yAxisID: 'y1',
                    },
                    {
                        label: 'Humidity (%)',
                        data: [],
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        yAxisID: 'y2',
                    },
                ],
            },
            options: {
                responsive: true,
                scales: {
                    y1: {
                        type: 'linear',
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Temperature (°C)',
                        },
                    },
                    y2: {
                        type: 'linear',
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Humidity (%)',
                        },
                    },
                },
                plugins: {
                    tooltip: {
                        mode: 'nearest',
                        intersect: false,
                    },
                },
            },
        });

        let selectedStation = null; // Store the currently selected station
        let pollingInterval = null; // Store the interval ID for polling

        // Function to fetch data and update the chart
        async function fetchWeatherData(stationName) {
            if (!stationName) return;

            try {
                const response = await fetch(`/get_station_data_by_name/${stationName}`);
                const data = await response.json();

                if (response.ok) {
                    // Update chart data
                    weatherChart.data.labels = data.timestamps;
                    weatherChart.data.datasets[0].data = data.temperatures;
                    weatherChart.data.datasets[1].data = data.humidities;
                    weatherChart.update();
                } else {
                    console.error("Error fetching data:", data.error);
                }
            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        }

        // Event listener for station selection
        document.getElementById('station-select').addEventListener('change', function () {
            selectedStation = this.value; // Update the selected station
            if (selectedStation) {
                fetchWeatherData(selectedStation); // Fetch data immediately

                // Stop any previous polling
                if (pollingInterval) clearInterval(pollingInterval);

                // Start polling every 5 seconds
                pollingInterval = setInterval(() => {
                    fetchWeatherData(selectedStation);
                }, 5000);
            }
        });
    </script>

{% endblock %}
